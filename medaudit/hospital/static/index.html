<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAudit Hospital</title>
<style>
:root{--bg:#f3f6f9;--panel:#fff;--line:#d9e1e9;--text:#17222e;--mute:#62758a;--acc:#0b6e99;--accbg:#e3f2f8;
--ok:#188a5b;--bad:#c9323f;--warn:#a86a00;--warnbg:#fff4df;--badbg:#fdeaec;--okbg:#e5f6ee}
@media (prefers-color-scheme:dark){:root{--bg:#0e1419;--panel:#161e26;--line:#26323e;--text:#dde6ee;--mute:#8497a9;
--acc:#4cb4e0;--accbg:#12303d;--ok:#3fb37f;--bad:#f0616d;--warn:#e5a93d;--warnbg:#33290f;--badbg:#3a1b1f;--okbg:#12301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;color:var(--acc)} header .sp{flex:1}
.who{font-size:13px;color:var(--mute)} .who b{color:var(--text)}
main{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
h2{margin:0 0 10px;font-size:16px} h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
button{padding:8px 14px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer}
button:hover{border-color:var(--acc)} button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{border-color:var(--bad);color:var(--bad)} button.danger:hover{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .row>.grow{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
tr.click:hover{background:var(--accbg);cursor:pointer}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--accbg);color:var(--acc)}
.pill.off{background:var(--badbg);color:var(--bad)}
.notice{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.notice.warn{background:var(--warnbg);color:var(--warn)} .notice.bad{background:var(--badbg);color:var(--bad)} .notice.ok{background:var(--okbg);color:var(--ok)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px} .kv div:nth-child(odd){color:var(--mute)}
.login{max-width:380px;margin:60px auto}
.hint{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.banner{font-size:12.5px;color:var(--mute);text-align:center;padding:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>MedAudit Hospital</h1>
  <span class="sp"></span>
  <span class="who" id="who" hidden></span>
  <button id="logout" hidden>Sign out</button>
</header>
<main id="app"></main>
<div class="banner">Every access to patient data is recorded in a tamper-evident, encrypted audit log.</div>

<script>
const $ = s => document.querySelector(s), app = $('#app');
let token = sessionStorage.getItem('tok'), me = null, idleTimer = null, IDLE = 900;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, method='GET', body) {
  const r = await fetch(path, {method, headers: {'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{})},
                               body: body ? JSON.stringify(body) : undefined});
  let data = null; try { data = await r.json(); } catch(e) {}
  if (r.status === 401 && token && path !== '/api/login') { signedOut('Your session has ended. Please sign in again.'); throw new Error('401'); }
  if (!r.ok) { const d = data?.detail; throw new Error(typeof d === 'string' ? d : Array.isArray(d) ? d.map(x=>x.msg).join('; ') : 'Request failed'); }
  return data;
}
function resetIdle() { clearTimeout(idleTimer); if (token) idleTimer = setTimeout(() => signedOut('Signed out after inactivity.'), IDLE*1000); }
['click','keydown'].forEach(e => document.addEventListener(e, resetIdle));
function signedOut(msg) { token = null; me = null; sessionStorage.removeItem('tok'); showLogin(msg); }

function chrome() {
  $('#who').hidden = $('#logout').hidden = !me;
  if (me) $('#who').innerHTML = `<b>${esc(me.full_name)}</b> · ${esc(me.role)}`;
}
$('#logout').onclick = async () => { try { await api('/api/logout','POST'); } catch(e) {} signedOut(); };

function showLogin(msg='') {
  chrome();
  app.innerHTML = `<div class="card login"><h2>Staff sign-in</h2>
    ${msg?`<div class="notice warn">${esc(msg)}</div>`:''}
    <label>Username</label><input id="u" autocomplete="username" autofocus>
    <label>Password</label><div class="row"><input id="p" class="grow" name="password" type="password" autocomplete="current-password" required><button type="button" id="toggle">Show</button></div>
    <div id="err"></div>
    <div class="row" style="margin-top:14px"><button class="primary" id="go">Sign in</button></div>
    <p class="hint">Demo accounts are printed by <code>scripts/init_system.py --demo</code>.</p></div>`;
  const go = async () => {
    try {
      const r = await api('/api/login','POST',{username:$('#u').value, password:$('#p').value});
      token = r.token; IDLE = r.idle_seconds; me = r.user; sessionStorage.setItem('tok', token); resetIdle(); home();
    } catch(e) { $('#err').innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
  };
  $('#go').onclick = go; $('#p').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#toggle').onclick = () => {
    const visible = $('#p').type === 'text';
    $('#p').type = visible ? 'password' : 'text';
    $('#toggle').textContent = visible ? 'Show' : 'Hide';
  };
}

async function home() {
  chrome();
  if (me.role === 'admin') return adminView();
  patientList();
}

async function patientList(q='') {
  app.innerHTML = `<div class="card"><div class="row"><h2 class="grow" style="margin:0">Patients</h2>
    <input id="q" class="grow" placeholder="Search by name or ID" value="${esc(q)}"><button id="s">Search</button>
    ${['receptionist','doctor'].includes(me.role)?'<button class="primary" id="new">Register patient</button>':''}</div>
    <div id="list" style="margin-top:10px"></div></div>`;
  $('#s').onclick = () => patientList($('#q').value); $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') patientList($('#q').value); });
  $('#new') && ($('#new').onclick = newPatient);
  try {
    const rows = await api('/api/patients?q=' + encodeURIComponent(q));
    $('#list').innerHTML = rows.length ? `<table><tr><th>ID</th><th>Name</th><th>DOB</th><th>Sex</th><th>Ward</th></tr>` +
      rows.map(r => `<tr class="click" data-pid="${esc(r.pid)}"><td>${esc(r.pid)}</td><td>${esc(r.name)}</td><td>${esc(r.dob)}</td><td>${esc(r.sex)}</td><td>${esc(r.ward)}</td></tr>`).join('') + '</table>'
      : '<p class="hint">No patients found.</p>';
    document.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => patientView(tr.dataset.pid));
  } catch(e) { $('#list').innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
}

function newPatient() {
  app.innerHTML = `<div class="card"><h2>Register patient</h2><div class="row">
    <div class="grow"><label>Full name</label><input id="n"></div><div class="grow"><label>Date of birth</label><input id="d" type="date"></div></div>
    <div class="row"><div class="grow"><label>Sex</label><select id="x"><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select></div>
    <div class="grow"><label>Ward</label><input id="w"></div></div><div id="err"></div>
    <div class="row" style="margin-top:14px"><button class="primary" id="ok">Register</button><button id="cancel">Cancel</button></div></div>`;
  $('#cancel').onclick = () => patientList();
  $('#ok').onclick = async () => {
    try { const r = await api('/api/patients','POST',{name:$('#n').value, dob:$('#d').value, sex:$('#x').value, ward:$('#w').value}); patientView(r.pid); }
    catch(e) { $('#err').innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
  };
}

async function patientView(pid) {
  let p; try { p = await api('/api/patients/' + pid); } catch(e) { return app.innerHTML = `<div class="card"><div class="notice bad">${esc(e.message)}</div><button onclick="patientList()">Back</button></div>`; }
  const clinical = p.clinical_access !== 'restricted';
  app.innerHTML = `<div class="card"><div class="row"><h2 class="grow" style="margin:0">${esc(p.name)} <span class="pill">${esc(p.pid)}</span></h2><button id="back">← Back</button></div>
    <div class="kv" style="margin-top:12px"><div>Date of birth</div><div>${esc(p.dob)}</div><div>Sex</div><div>${esc(p.sex)}</div><div>Ward</div><div>${esc(p.ward)||'—'}</div></div>
    <h3>Clinical record</h3>
    ${clinical ? `${p.clinical_access==='break_glass'?'<div class="notice warn"><b>Emergency (break-glass) access</b> — this access is flagged and will be reviewed by compliance.</div>':''}
      <label>Diagnosis</label><textarea id="dx" ${p.can_edit?'':'readonly'}>${esc(p.diagnosis)}</textarea>
      <label>Clinical notes</label><textarea id="nt" ${p.can_edit?'':'readonly'}>${esc(p.notes)}</textarea><div id="msg"></div>
      ${p.can_edit?'<div class="row" style="margin-top:10px"><button class="primary" id="save">Save changes</button></div>':'<p class="hint">Read-only for your role.</p>'}`
    : `<div class="notice warn">You are not assigned to this patient, so the clinical record is hidden. This attempt has been logged.</div>
       ${p.can_break_glass?`<p class="hint">In a genuine emergency you may use break-glass access. You must state a reason; it is logged as a critical event and reviewed.</p>
       <label>Reason for emergency access</label><input id="why" placeholder="e.g. Patient collapsed in corridor; treating"><div id="msg"></div>
       <div class="row" style="margin-top:10px"><button class="danger" id="bg">Break glass</button></div>`:''}`}</div>`;
  $('#back').onclick = () => patientList();
  $('#save') && ($('#save').onclick = async () => {
    try { await api(`/api/patients/${pid}/clinical`,'PUT',{diagnosis:$('#dx').value, notes:$('#nt').value}); $('#msg').innerHTML = '<div class="notice ok">Saved.</div>'; }
    catch(e) { $('#msg').innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
  });
  $('#bg') && ($('#bg').onclick = async () => {
    try { await api(`/api/patients/${pid}/break-glass`,'POST',{reason:$('#why').value}); patientView(pid); }
    catch(e) { $('#msg').innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
  });
}

async function adminView(tab='users') {
  let d, ids; try { d = await api('/api/admin/users'); ids = await api('/api/admin/patient-ids'); } catch(e) { return; }
  app.innerHTML = `<div class="card"><h2>Administration <span class="hint">(no access to patient data)</span></h2><div id="msg"></div>
    <h3>Staff accounts</h3><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr>
    ${d.users.map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.full_name)}</td><td>${esc(u.role)}</td>
      <td><span class="pill ${u.active?'':'off'}">${u.active?'active':'disabled'}</span></td>
      <td>${u.username===me.username?'':`<button data-u="${esc(u.username)}" data-a="${u.active?0:1}">${u.active?'Disable':'Enable'}</button>`}</td></tr>`).join('')}</table>
    <h3>Add staff account</h3><div class="row"><div class="grow"><label>Username</label><input id="nu"></div><div class="grow"><label>Full name</label><input id="nf"></div>
    <div class="grow"><label>Role</label><select id="nr"><option>doctor</option><option>nurse</option><option>receptionist</option><option>admin</option></select></div>
    <div class="grow"><label>Initial password</label><input id="np" type="password"></div><button class="primary" id="add" style="margin-top:22px">Create</button></div>
    <h3>Care assignments</h3><table><tr><th>Staff</th><th>Patient ID</th><th></th></tr>
    ${d.assignments.map(a => `<tr><td>${esc(a.username)}</td><td>${esc(a.pid)}</td><td><button data-rm="${esc(a.username)}|${esc(a.pid)}">Remove</button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><div class="grow"><label>Staff (doctor/nurse)</label><select id="au">${d.users.filter(u=>['doctor','nurse'].includes(u.role)).map(u=>`<option>${esc(u.username)}</option>`).join('')}</select></div>
    <div class="grow"><label>Patient</label><select id="ap">${ids.map(i=>`<option>${esc(i)}</option>`).join('')}</select></div><button id="asg" style="margin-top:22px">Assign</button></div></div>`;
  const msg = (t,k='bad') => $('#msg').innerHTML = `<div class="notice ${k}">${esc(t)}</div>`;
  document.querySelectorAll('button[data-u]').forEach(b => b.onclick = async () => { try { await api(`/api/admin/users/${b.dataset.u}/active`,'POST',{active:b.dataset.a==='1'}); adminView(); } catch(e) { msg(e.message); } });
  document.querySelectorAll('button[data-rm]').forEach(b => b.onclick = async () => { const [u,p]=b.dataset.rm.split('|'); try { await api('/api/admin/assign','POST',{username:u,pid:p,assigned:false}); adminView(); } catch(e) { msg(e.message); } });
  $('#add').onclick = async () => { try { await api('/api/admin/users','POST',{username:$('#nu').value, full_name:$('#nf').value, role:$('#nr').value, password:$('#np').value}); adminView(); } catch(e) { msg(e.message); } };
  $('#asg').onclick = async () => { try { await api('/api/admin/assign','POST',{username:$('#au').value, pid:$('#ap').value, assigned:true}); adminView(); } catch(e) { msg(e.message); } };
}

(async () => {
  if (token) { try { me = await api('/api/me'); resetIdle(); return home(); } catch(e) {} }
  showLogin();
})();
</script>
</body>
</html>
