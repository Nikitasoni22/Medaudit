name: Security and quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies without source builds
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'
      - name: Static correctness checks
        run: python -m ruff check medaudit tests scripts
      - name: Security regression tests
        run: python -m pytest tests -q --cov=medaudit --cov-report=term-missing --cov-report=xml
      - name: Isolated tampering and rollback experiment
        run: python scripts/demo_lab.py
      - name: Runtime dependency advisory check
        if: runner.os == 'Linux'
        run: python -m pip_audit -r requirements.lock --disable-pip --no-deps
      - name: Install browser
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Browser acceptance checks
        if: runner.os == 'Linux'
        run: python scripts/browser_check.py
      - name: Reject tracked generated secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^data/|\.pyc$|\.keys$|state\.key$|(^|/)\.env$)'; then
            echo 'Generated secrets or bytecode must not be tracked.'
            exit 1
          fi
